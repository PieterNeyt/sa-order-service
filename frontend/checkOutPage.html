<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
</head>
<body>
<h1>Checkout</h1>
<p>Vul hieronder je gegevens in om je bestelling af te ronden.</p>

<form action="/checkout" method="post">
  <fieldset>
    <legend>Persoonlijke gegevens</legend>

    <label for="name">Naam:</label><br>
    <input type="text" id="name" name="name" required><br><br>

    <label for="email">Contact e-mail:</label><br>
    <input type="email" id="email" name="email" required><br><br>
  </fieldset>

  <fieldset>
    <legend>Leveradres</legend>

    <label for="street">Straat en huisnummer:</label><br>
    <input type="text" id="street" name="street" required><br><br>

    <label for="postalcode">Postcode:</label><br>
    <input type="text" id="postalcode" name="postalcode" required><br><br>

    <label for="city">Stad:</label><br>
    <input type="text" id="city" name="city" required><br><br>

  </fieldset>

  <button type="submit">Bestelling afronden</button>
</form>
</body>
</html>
