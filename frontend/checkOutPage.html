<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout</title>
</head>
<body>
<h1>Checkout</h1>

<input type="hidden" id="orderId" value="">
<input type="hidden" id="restaurantId" value="">

<p>Vul hieronder je gegevens in om je bestelling af te ronden.</p>

<label for="name">Naam:</label><br>
<input type="text" id="name" required><br><br>

<label for="email">Contact e-mail:</label><br>
<input type="email" id="email" required><br><br>

<label for="street">Straat en huisnummer:</label><br>
<input type="text" id="street" required><br><br>

<label for="postalcode">Postcode:</label><br>
<input type="text" id="postalcode" required><br><br>

<label for="city">Stad:</label><br>
<input type="text" id="city" required><br><br>

<button id="checkoutBtn">Bestelling afronden</button>

</body>
</html>
