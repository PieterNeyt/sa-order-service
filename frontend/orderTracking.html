<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Order Tracking - Foodie</title>
    <link rel="stylesheet" href="src/css/style.css">
    <script type="module" src="./src/main.ts"></script>
    <script type="module" src="./src/ts/orderTracking.ts"></script>
</head>
<body>
<nav class="navbar">
    <div class="logo">Foodie</div>
    <div class="nav-links">
        <a href="index.html">Restaurants</a>
        <button class="login-btn" id="login-btn">Inloggen</button>
    </div>
</nav>

<div id="loading">
    <p>Order gegevens laden...</p>
</div>

<div id="error" style="display: none;">
    <p>Er is een fout opgetreden bij het laden van de order.</p>
    <a href="index.html">Terug naar restaurants</a>
</div>

<div id="order-content" style="display: none;">
    <p>Bedankt voor je bestelling!</p>
    <p>We doen ons best om ze zo snel mogelijk te verwerken.</p>

    <p>Je producten:</p>
    <ul id="products-list">
    </ul>

    <p>Totaalsom: <strong id="total-price"></strong></p>

    <p>Bestelstatus: <strong id="order-status"></strong></p>

    <a href="index.html">Terug naar restaurants</a>
</div>

</body>
</html>
